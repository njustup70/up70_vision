[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "up70-vision"
version = "0.0.1"
description = "UP70 RGB-D runtime for driverLogic_2027"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "opencv-python==4.11.0.86", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vision", "vision.*"]
