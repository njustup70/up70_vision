# 全局默认配置。
#
# 所有参数都可以用命令行覆盖，不需要改这个文件：
#   python -m up70_vision run --set color.hit_ratio_min=0.6
# 点分路径对应下面的层级，例如 detector.blob.min_area_px。
#
# 哪些改动会影响自检数字：
#   input.synthetic.num_frames / blocks_per_frame —— 直接改变总色块数
#   input.synthetic.seed            —— 改变色块位置与噪声，但总数不变
#   color.*                         —— 改错会导致判色正确率下降
#   detector.blob.min_area_px       —— 调太大会把真正的色块也过滤掉

input:
  # synthetic：读取用 OpenCV 合成的色块图，不需要任何素材文件
  # replay：回放一个图片目录或视频文件（路径在 input.replay.path）
  # camera：真相机（海康 MV-CU013-A0UC，走厂商 MVS SDK）。
  #   需要镜像里装了 MVS —— deb 放 .devcontainer/pkgs/，见该目录的 README。
  source: synthetic

  synthetic:
    width: 640
    height: 480
    num_frames: 3
    # 6 与内置颜色数一致，保证每帧 6 个块颜色互不相同。
    # 自检的期望值「总色块 18 = 3 帧 x 6 块」就来自这两个参数。
    blocks_per_frame: 6
    seed: 2027
    noise_sigma: 8.0
    background_bgr: [30, 30, 30]

  replay:
    path: data/clips
    kind: auto
    frame_stride: 1
    max_frames: 0

  # 真相机（input.source=camera 时生效）：海康 MV-CU013-A0UC，走厂商 MVS SDK。
  # 需要镜像里装了 MVS（deb 放 .devcontainer/pkgs/，见该目录 README）。
  camera:
    # 多台相机时选第几台
    index: 0
    # 曝光（微秒）。**这是这颗相机最关键、也最需要按场地重调的参数**：
    #   照度不足时优先加光 / 开大光圈，一味拉长曝光会掉帧率、在移动目标上留拖影。
    #   本机实测：20ms 太暗（灰度均值 20）、80ms+10dB 合适（均值 180）、200ms 过曝。
    #   **动目标（手举码晃动）建议降到 40ms**：拖影减半、帧率上限 25 fps、画面暗一半，
    #   实测静置仍可稳定识别。80ms 下晃动会因运动模糊丢码——码在曝光期内移动约 20 px，
    #   与 4x4 单格尺寸相当，格子边界直接糊掉（2026-10-17 实测）。
    #   设成 0 表示不改动相机当前值。
    exposure_us: 80000.0
    # 增益（dB），0 表示 0dB（不是"不设置"）
    gain_db: 10.0
    # 单次取帧等待上限（毫秒）；超时后本路输入结束（read 返回 None）
    timeout_ms: 1000
    # 最多取多少帧，0 = 不限（实时场景靠 Ctrl+C 或命令行 --limit 停）
    max_frames: 0

color:
  # 相对路径以本文件所在目录（configs/）为基准
  thresholds_file: color_thresholds.yaml
  # 判色门槛（饱和度/亮度下限、命中率门槛、边框裁剪、最少有效像素）**不在本文件**：
  # 它们与颜色范围是同一件事的两半，统一放在 color_thresholds.yaml 文件头的 `color:` 段
  # ——调颜色只开一个文件。在这里写同名键仍然会生效（并盖住阈值表里的值），
  # 但那是给临时实验用的，日常调参请改阈值表。

detector:
  # blob      ：占位检测器，饱和度/亮度分割 + 轮廓提取，不需要模型权重；返回 list[Detection]
  # stub_aruco：按契约返回**假** ArUco 码的 stub（任务单第一节第 4 条），
  #             返回 list[ArucoMarker]；等真实现 aruco.py 就位后直接换掉。
  #             注意：stub 靠内部帧计数器决定"码转到哪"，**每帧只能调一次 detect**。
  # aruco     ：真 ArUco 检测器（DICT_4X4_50），返回 list[ArucoMarker]；测试图组见 assets/aruco/
  # 返回值结构见 docs/interface.md 第 2、3 节
  name: blob

  blob:
    min_area_px: 400
    morph_kernel: 5
    max_detections: 32

  stub_aruco:
    ids: [0, 1, 2]      # 伪造哪几个码 ID（也决定自检的期望个数）
    side_px: 90         # 码边长（像素）
    moving: true        # 第一个码转圈 + 自转，用于验证"移动 / 旋转时持续更新"
    # 无码模式（任务单第 6 条）。这两行必须真实存在，`--set detector.stub_aruco.mode=none`
    # 才能覆盖到它们（--set 只能改已存在的字段，不会凭空加键）。
    mode: normal        # normal = 正常出码；none = 恒无码（造无码输入用）
    empty_after: 0      # >0 时跑满 N 帧后开始无码，演"码移出画面"；0 = 不启用

  # aruco：真 ArUco 检测（任务单「搭档 Owner：检测核心」的产出）
  #   用法：--set detector.name=aruco 配合图片回放/相机；测试图组见 assets/aruco/
  #   自检：python -m up70_vision.tools.aruco_check --dir assets/aruco
  aruco:
    dictionary: DICT_4X4_50   # 任务单指定；换字典会让已有测试图组的真值全部作废
    corner_refine: subpix     # none / subpix / contour。subpix 把角点做到亚像素，
                              # 位姿估计（solvePnP）阶段直接吃这个精度
    min_perimeter_rate: 0.03  # 检出码的最小周长占图像周长比例；调小能捞小码、也更容易误报
    max_detections: 0         # 单帧最多返回几个（0=不限）；超限时保留面积最大的几个

  # yolo：ONNX 权重 + cv2.dnn 推理（core/detectors/yolo.py）。
  #   为什么走 ONNX：容器里只要 cv2，不用装 1.4 GB 的 torch（实测 26.4 ms/帧，够 25 fps）。
  #   权重不进版本库（.gitignore 已忽略 *.onnx），先导出一次：
  #       python scripts/export_yolo.py --weights yolov8n.pt
  #   用法：--set detector.name=yolo
  #   提醒：YOLOv8 是 AGPL-3.0；对外发布前要跟队长确认许可。
  yolo:
    weights: assets/models/yolov8n.onnx
    conf: 0.25            # 置信度下限；调低会明显多出误检
    iou: 0.45             # NMS 的 IoU 阈值；调低会吃掉相邻的框
    imgsz: 640            # ONNX 的固定输入边长（必须是 32 的倍数，与权重一致）
    max_detections: 32
    classes: []           # 只保留这些类别索引（如 [0] 只看 person）；空 = 全部
    class_names: []       # 类名表；空 = 尝试读 ONNX 元数据，读不到就显示索引数字
    device: cpu           # 目前只支持 cpu（cv2.dnn 在这台机器上没有 CUDA 后端）

output:
  enabled: true
  dir: output/demo
  save_overlay: true
  save_json: true
  save_csv: true

log:
  # DEBUG 会把每帧的候选框数与各颜色命中率都打出来，调阈值时开着很有用
  level: INFO

# 相机内参：位姿估计（solvePnP）的必需输入，由 scripts/calibrate_camera.py 生成。
# 每台相机一份，**不进版本库**（.gitignore 已排除），所以要向做过标定的队友要，
# 或自己拍一组棋盘图重新标定。
calibration:
  # 相对本文件所在目录（configs/）解析，与 color.thresholds_file 同一个规矩
  file: camera_calibration.yaml
  # false：找不到内参时只关闭位姿功能并打一条警告，检测与判色照常跑
  # true ：没内参就直接报错退出——现场与 CI 用这个，免得"以为在算位姿，其实没算"
  required: false

# ArUco 位姿估计（任务单第 2 条）。默认关闭：不开时实时入口的输出与改造前完全一致。
pose:
  enabled: false
  # 码边长（毫米）：**卡尺量黑框外沿到外沿，不含白边，必须实测**。
  # 23.0 是本队这批码的实量值（这台打印机把标称 15 mm 打成了 23 mm，见坑 40），
  # 不是通用值：换码必须重量。填错不会让重投影误差变大，只会让距离按同比例错——
  # 填 40 而实际 23 会让距离整体偏 +74%，且 RMS 完全正常。
  marker_size_mm: 23.0
  # ippe_square：专为正方形共面四点设计，闭式解、不要初值（默认）
  # iterative  ：OpenCV 通用迭代解，需要初值；只在排查问题时用
  method: ippe_square
  # 用 solvePnPRefineLM 再精化一次，只接受"重投影更小"的结果
  refine: true
  # 平面位姿天然有两个解。次优解与最优解的 RMS 之比小于 ambiguity_ratio、
  # 且两解旋转夹角超过 ambiguity_deg 时，结果标 ambiguous=True（只做诊断，不剔除）。
  # 这两个数别改成绝对像素：实测两解 RMS 差随距离变小（500 mm 处 0.68 px、1000 mm 处 0.34 px）。
  ambiguity_ratio: 3.0
  ambiguity_deg: 10.0
  # 重投影 RMS 上限（像素）：超过直接抛错，不返回"看起来正常"的位姿。
  # 实测正常解算在 0.02–0.9 px，模型点顺序写错会到 100 px 以上。
  max_reproj_rms_px: 2.0
