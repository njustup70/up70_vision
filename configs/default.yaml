# 全局默认配置。
#
# 所有参数都可以用命令行覆盖，不需要改这个文件：
#   python scripts/run.py --set color.hit_ratio_min=0.6
# 点分路径对应下面的层级，例如 detector.blob.min_area_px。
#
# 哪些改动会影响自检数字：
#   input.synthetic.num_frames / blocks_per_frame —— 直接改变总色块数
#   input.synthetic.seed            —— 改变色块位置与噪声，但总数不变
#   color.*                         —— 改错会导致判色正确率下降
#   detector.blob.min_area_px       —— 调太大会把真正的色块也过滤掉

input:
  # synthetic：读取用 OpenCV 合成的色块图，不需要任何素材文件
  # replay：回放一个图片目录或视频文件（路径在 input.replay.path）
  # camera：真相机（海康 MV-CU013-A0UC，走厂商 MVS SDK）。
  #   需要镜像里装了 MVS —— deb 放 .devcontainer/pkgs/，见该目录的 README。
  source: synthetic

  synthetic:
    width: 640
    height: 480
    num_frames: 3
    # 6 与内置颜色数一致，保证每帧 6 个块颜色互不相同。
    # 自检的期望值「总色块 18 = 3 帧 x 6 块」就来自这两个参数。
    blocks_per_frame: 6
    seed: 2027
    noise_sigma: 8.0
    background_bgr: [30, 30, 30]

  replay:
    path: data/clips
    kind: auto
    frame_stride: 1
    max_frames: 0

  # 真相机（input.source=camera 时生效）：海康 MV-CU013-A0UC，走厂商 MVS SDK。
  # 需要镜像里装了 MVS（deb 放 .devcontainer/pkgs/，见该目录 README）。
  camera:
    # 多台相机时选第几台
    index: 0
    # 曝光（微秒）。**这是这颗相机最关键、也最需要按场地重调的参数**：
    #   照度不足时优先加光 / 开大光圈，一味拉长曝光会掉帧率、在移动目标上留拖影。
    #   本机实测：20ms 太暗（灰度均值 20）、80ms+10dB 合适（均值 180）、200ms 过曝。
    #   设成 0 表示不改动相机当前值。
    exposure_us: 80000.0
    # 增益（dB），0 表示 0dB（不是"不设置"）
    gain_db: 10.0
    # 单次取帧等待上限（毫秒）；超时后本路输入结束（read 返回 None）
    timeout_ms: 1000
    # 最多取多少帧，0 = 不限（实时场景靠 Ctrl+C 或命令行 --limit 停）
    max_frames: 0

color:
  # 相对路径以本文件所在目录（configs/）为基准
  thresholds_file: color_thresholds.yaml
  # 饱和度与亮度下限：低于它们的像素视为"没有颜色"（灰、黑、白、背景），
  # 不参与判色统计。这是颜色识别任务里最需要按场地光照重调的两个数。
  min_saturation: 40
  min_value: 40
  # 命中率门槛，单位是比例不是百分比。设成 1.0 意味着"必须整块都是这个颜色"，
  # 在有色噪声的合成图上会直接全部判成 unknown。
  hit_ratio_min: 0.50
  ignore_border_px: 3

detector:
  # blob      ：占位检测器，饱和度/亮度分割 + 轮廓提取，不需要模型权重；返回 list[Detection]
  # stub_aruco：按契约返回**假** ArUco 码的 stub（任务单第一节第 4 条），
  #             返回 list[ArucoMarker]；等真实现 aruco.py 就位后直接换掉。
  #             注意：stub 靠内部帧计数器决定"码转到哪"，**每帧只能调一次 detect**。
  # aruco     ：真 ArUco 检测器（DICT_4X4_50），返回 list[ArucoMarker]；测试图组见 assets/aruco/
  # 返回值结构见 docs/interface.md 第 2、3 节
  name: blob

  blob:
    min_area_px: 400
    morph_kernel: 5
    max_detections: 32

  stub_aruco:
    ids: [0, 1, 2]      # 伪造哪几个码 ID（也决定自检的期望个数）
    side_px: 90         # 码边长（像素）
    moving: true        # 第一个码转圈 + 自转，用于验证"移动 / 旋转时持续更新"

  # aruco：真 ArUco 检测（任务单「搭档 Owner：检测核心」的产出）
  #   用法：--set detector.name=aruco 配合图片回放/相机；测试图组见 assets/aruco/
  #   自检：python -m up70_vision.tools.aruco_check --dir assets/aruco
  aruco:
    dictionary: DICT_4X4_50   # 任务单指定；换字典会让已有测试图组的真值全部作废
    corner_refine: subpix     # none / subpix / contour。subpix 把角点做到亚像素，
                              # 位姿估计（solvePnP）阶段直接吃这个精度
    min_perimeter_rate: 0.03  # 检出码的最小周长占图像周长比例；调小能捞小码、也更容易误报
    max_detections: 0         # 单帧最多返回几个（0=不限）；超限时保留面积最大的几个

output:
  enabled: true
  dir: output/demo
  save_overlay: true
  save_json: true
  save_csv: true

log:
  # DEBUG 会把每帧的候选框数与各颜色命中率都打出来，调阈值时开着很有用
  level: INFO
