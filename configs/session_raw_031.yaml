# raw_031：共同像素网格核查 · 偏左上（第 2/3 段）。
#
# 同一机位、同一块棋盘，只把板子挪到画面左上 1/4。目的：让角点覆盖画面另一片区域。
# 如果彩色与深度的偏差只出现在边缘、中心为零，那就是畸变网格不一致；
# 如果整幅图都是同一个常数平移，那是外参问题。单靠居中的一段区分不了这两种。

