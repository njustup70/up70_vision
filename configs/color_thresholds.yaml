# HSV 阈值表 —— 判色算法的唯一参数来源（颜色范围 + 判色门槛，都在这一个文件里）
#
# 代码里不硬编码任何阈值：真实场地的光照一变，阈值就得重调，把阈值关在代码里
# 等于每次调参都要改代码、跑测试、重新提交。
#
# 为什么两类参数住同一个文件
#   「什么算这个颜色」（下面每色一段的 HSV 范围）和「什么算有效像素、命中多少才算数」
#   （文件头的 color: 段）是同一件事的两半，调颜色时必须一起看。
#   以前后一半写在 configs/default.yaml 的 color: 段，还有两个名字几乎一样、语义完全不同的
#   S 门槛分散在两处：
#     · min_saturation（本文件 color: 段）= "什么算有效像素"，是命中率的**分母**
#     · s_lo（下面每色一段里）        = "什么算这个颜色"，是命中率的**分子**
#   第一次看这两个数的人必然懵，而且改错一个不会报错，只会让命中率悄悄偏低。
#   现在**调颜色只开这一个文件**。
#
# 格式
#   color:                     <- 保留键：判色门槛（不是颜色名，别在这儿加颜色）
#     min_saturation: 40
#     ...
#   颜色名:
#     - [h_lo, s_lo, v_lo, h_hi, s_hi, v_hi]   # 第 1 段
#     - [h_lo, s_lo, v_lo, h_hi, s_hi, v_hi]   # 第 2 段（可选，同一颜色可有多段）
#
# 通道范围（这是最容易抄错的地方）
#   H（色相）：0 - 179     <-- 不是 0-360！OpenCV 为了塞进 uint8 压缩了一半
#   S（饱和度）：0 - 255   越低越接近灰白
#   V（亮度）：0 - 255     越低越接近黑
#
# 想加一个新颜色：在下面按同样格式加一项即可，代码会自动识别，
#   不需要改任何 Python 文件。

# ================================================================ 判色门槛
# 整份程序只读这一处；命令行可以用 --set color.hit_ratio_min=0.6 临时覆盖（只改本次运行）。
color:
  # 饱和度下限：低于它的像素视为"没有颜色"（灰、黑、白、背景），不参与判色统计。
  # 真实场地光照一变，最需要重调的就是这个和 min_value。
  min_saturation: 40
  # 亮度下限：低于它视为"太暗"，同样不计入分母。
  min_value: 40
  # 命中率门槛，单位是**比例不是百分比**。设成 1.0 意味着"必须整块都是这个颜色"，
  # 在有色噪声的合成图上会直接全部判成 unknown。下游机械臂拿到 unknown 会停手，
  # 拿到错颜色会抓错东西——所以宁可严一点（0.50 是本仓库实测的折中）。
  hit_ratio_min: 0.50
  # 判色前把框的外圈裁掉几像素：轮廓边缘常混进背景色，裁掉能明显降低误判。
  ignore_border_px: 3
  # 有效像素少于这个数就不下结论（"看不清就报不确定"），避免 3 个像素判出一个颜色。
  min_valid_pixels: 25

# ================================================================ 颜色范围
# 调参方式（tools/blob/hsv_tuner.py，需要 GUI）：
#   python -m up70_vision hsv-tuner --image <一张包含该颜色的图>
#   拖滑条调到只剩目标颜色在掩码里发白，回车会把阈值写回本文件（注释全部保留）。

# 红色必须写两段：色相是首尾相接的圆环，0 和 179 是同一点。
# 偏橙的红落在 H≈0-10，偏紫的红落在 H≈170-179。
red:
  - [0, 120, 70, 10, 255, 255]
  - [170, 120, 70, 179, 255, 255]

# 其余颜色各一段即可。
# S 下限统一取 120、V 下限取 70 的理由：
#   场地灯光偏暗时色块会有阴影面，V 门槛过高会把阴影面整个丢掉，
#   导致框内有效像素太少、命中率抖动；70 是实测能保住阴影面
#   又不会把深灰背景纳入的折中值。真实场地请用调参工具重新确认。
yellow:
  - [20, 120, 70, 40, 255, 255]

green:
  - [45, 120, 70, 75, 255, 255]

cyan:
  - [80, 120, 70, 100, 255, 255]

blue:
  - [105, 120, 70, 135, 255, 255]

magenta:
  - [135, 120, 70, 165, 255, 255]
