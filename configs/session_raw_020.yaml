# raw_020：遮挡样例（两箱前后错开）。
#
# 为什么要单独录这一段
#   raw_013..017 的箱子是「孤立物体」：箱子四周是深度无效区（左/右 12-25 px、
#   地面几乎全黑），轮廓外侧没有有效深度，点选出来的「偏移」只是无效带宽度，
#   不是几何错位。要量像素对齐，必须让边界两侧都有有效深度：
#   近箱轮廓压在远箱的前立面上，跳变两侧都是真实深度值。
#
# 摆法
#   近箱：距镜头前沿约 400 mm，放在画面中部偏左。
#   远箱：距镜头前沿约 700 mm，居中，与近箱水平方向重叠约 1/3 箱宽，
#         使近箱的右边缘落在远箱的前立面上（而不是落在背景/地面）。
#   两箱都正对相机，不要斜放；重叠处不要出现第三个物体。

schema_version: 1
session: raw_020

scene:
  condition_id: occluded_pair
  position: center
  distance_band: near
  measured_distance_mm: null
  distance_reference: null
  object_id: box_01_near + box_02_far
  object_size_mm: [205.0, 205.0, 205.0]
  camera_fixed: true
  measurement_notes: 两箱前后错开，近箱约 400 mm、远箱约 700 mm，均口述、未用卷尺实测；近箱右缘压在远箱前立面上

capture:
  mode: aligned
  camera_node: camera
  warmup_s: 3.0
  duration_s: 10.0
  complete: false
  topics:
    color: /camera/color/image_raw
    depth: /camera/depth/image_raw
    color_info: /camera/color/camera_info
    depth_info: /camera/depth/camera_info
  depth_unit: mm
  time_domain: global
  requested_profile: color 848x480@30 MJPG, depth 848x480@30 Y16 (D2C 到彩色)
  actual_profile: null
  geometry_evidence: null
  snapshots: null
