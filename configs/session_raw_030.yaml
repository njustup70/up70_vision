# raw_030：共同像素网格核查 · 居中正对（第 1/3 段）。
#
# 为什么录这一段：彩色图 `enable_color_undistortion=false`（CameraInfo 的 D 非零），
# 而 SW D2C 的对齐 profile 用的是目标 K + 零畸变。两者 K 与光学 frame 相同，
# 但这不能证明它们落在同一像素网格上。棋盘角点给出一批亚像素级对应点，
# 才能看出「像素差是否随画面位置漂移」——常数平移是外参，随位置漂移才是网格不一致。
#
# 与三场景包（raw_023–025）的区别：本段不测边、不进三场景统计，只服务于网格核查。
# 相机的机位、曝光策略、帧率在三段之间必须保持不变，否则差值里混进了别的因素。

