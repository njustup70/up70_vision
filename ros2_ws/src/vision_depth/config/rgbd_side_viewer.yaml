# 实时查看器独立配置；相机档位仍由 rgbd_capture.yaml 管理。
# 从仓库根启动时，weights 相对仓库根；其他位置请传绝对路径。
rgbd_side_viewer:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    color_info_topic: /camera/color/camera_info
    depth_info_topic: /camera/depth/camera_info
    weights: knowledge/models/yolov8n_mix2.onnx
    imgsz: 640
    conf: 0.45
    iou: 0.45
    max_detections: 32
    # [-1] 表示全部模型类别；指定类别时用非负编号，例如 [0]。
    target_classes: [-1]
    # [''] 表示自动读模型旁 .names.json 或 ONNX 元数据；可填写完整类名表。
    class_names: ['']
    aligned_depth: true
    depth_unit: mm
    sync_tolerance_ms: 10.0
    sync_wait_ms: 50.0
    queue_capacity: 10
    max_age_ms: 500.0
    leaf_mm: 4.0
    threshold_mm: 6.0
    iterations: 200
    seed: 0
    min_points: 120
    output_dir: output/realtime_side
    headless: false
    # 0.0 表示直到按 Q/Esc 退出；headless 验证可填 60.0。
    max_runtime_s: 0.0
