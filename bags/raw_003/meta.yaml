# 历史尺测数据来自 vision/depth/docs/progress.md 3.6 与 output/checks/raw003_checks.json。
bag: raw_003
camera:
  model: Orbbec Gemini 336L
  serial: null
  firmware: null
streams:
  depth:
    topic: /camera/depth/image_raw
    info_topic: /camera/depth/camera_info
    width: 848
    height: 480
    format: 16UC1
    depth_unit: mm
    depth_scale_source: 历史记录 enable_depth_scale=true，需录制时配置核实
setup:
  height_mm: null
  tilt_deg: 60.0
  tilt_source: 手机水平仪，参考 vision/depth/docs/progress.md 3.6
  tilt_reference_and_uncertainty: null
  object_layout: null
  mount: null
scene:
  type: 单个纸箱
  objects:
    - size_mm: [205.0, 205.0, 205.0]
      height_mm: 205.0
      measurement: 直尺，参考 vision/depth/docs/progress.md 3.6
      ruler_resolution_and_uncertainty: null
      top_center_optical_mm: null
notes: |
  参考值来自历史记录，原始现场记录不可追溯的测量基准与不确定度保持未知。
  顶面中心绝对坐标没有独立真值，不可用此 bag 签署 M2 绝对位置精度。
  深度图是否已校正及 camera_info 与像素的对应关系需要进一步核查。
