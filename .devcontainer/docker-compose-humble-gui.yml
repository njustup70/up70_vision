# 可选 X11 覆盖；只在需要窗口时与 humble compose 一起使用。
services:
  hik:
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: '1'
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
  gemini:
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: '1'
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
