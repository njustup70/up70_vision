# 从仓库根执行；默认仅软件环境，不透传设备或显示服务。
name: up70-vision-humble

services:
  humble:
    image: up70-vision:humble
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.humble
      target: base
    working_dir: /opt/vision
    volumes:
      - ..:/opt/vision

  hik:
    profiles: [hik]
    image: up70-vision:humble-hik
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.humble
      target: hik
    working_dir: /opt/vision
    volumes:
      - ..:/opt/vision
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'

  gemini:
    profiles: [gemini]
    image: up70-vision:humble-gemini
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.humble
      target: gemini
    working_dir: /opt/vision
    volumes:
      - ..:/opt/vision
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    # 同机 ROS 图像传输；不作为跨机网络配置。
    network_mode: host
    ipc: host
