# up70-vision 开发环境（CPU）。
#
# 用法（在仓库根目录执行）：
#   docker compose -f .devcontainer/docker-compose.yml build                  # 建镜像，只需一次
#   docker compose -f .devcontainer/docker-compose.yml run --rm up70-vision   # 跑环境自检
#   docker compose -f .devcontainer/docker-compose.yml run --rm up70-vision python -m vision demo
#
# 源码以 bind mount 挂进容器：改宿主机上的代码在容器里立即生效，不用重建镜像。
# 只有改了 pyproject.toml（增删依赖）才需要重新 build。

services:
  up70-vision:
    build:
      # context 必须是仓库根：Dockerfile 里是 COPY . .，得能拿到 pyproject.toml 与 src/。
      # 本文件位于 .devcontainer/ 下，所以上一级（..）正好是仓库根。
      context: ..
      # dockerfile 这个路径是相对 context 解析的，不是相对本文件，所以要写全 .devcontainer/Dockerfile
      dockerfile: .devcontainer/Dockerfile
    image: up70-vision:dev
    working_dir: /opt/vision
    volumes:
      # 宿主仓库根 -> 容器内固定路径，与 Dockerfile 的 WORKDIR 一致
      - ..:/opt/vision
    # 真相机透传：这颗海康相机走 USB3 Vision（GenICam），数据走 libusb 的
    # /dev/bus/usb/...，**不是 UVC**，宿主机上根本没有 /dev/video* 可传。
    # 权限在宿主机用 udev 规则给（见 README.md），容器里改不了。
    # 不接相机时留着这一行也无害：它只是把 USB 总线暴露进来。
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    # 默认命令：环境自检（统一入口，等价于原来的 python scripts/check_env.py）
    command: python -m vision doctor
