# 从仓库根运行；默认进入终端，不自动启动相机。
name: up70-vision

services:
  vision:
    image: up70-vision:humble
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        WITH_MVS: ${WITH_MVS:-0}
    working_dir: /opt/vision
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: '1'
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-97}
    volumes:
      - ..:/opt/vision
      # USB 总线支持热插拔；访问权限仍由宿主机 udev 决定。
      - /dev/bus/usb:/dev/bus/usb
      # 无 DISPLAY 时不启用窗口；无头任务沿用各命令的 headless 参数。
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    device_cgroup_rules:
      - 'c 189:* rmw'
    # 现有 launch 使用仅共享内存 DDS；这里只支持同机通信。
    network_mode: host
    ipc: host
    command: bash
